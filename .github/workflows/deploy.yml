name: deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_KEY: ${{ secrets.API_KEY }}
      - name: fix frontend permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: sudo rm -rf /home/ubuntu/apps/inv-platform/frontend/ && mkdir -p /home/ubuntu/apps/inv-platform/frontend/
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          source: frontend/dist/
          target: /home/ubuntu/apps/inv-platform/frontend/
          strip_components: 1
      - name: restart backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          command_timeout: 2m
          script_stop: true
          script: |
            cd /home/ubuntu/apps/inv-platform
            git pull
            # uv 建的 venv 不带 pip；且 venv 存在≠可用（系统 python 被换掉后目录还在）
            [ -x .venv/bin/python ] || uv venv --python 3.14 .venv
            uv pip install -q --python .venv/bin/python \
              -r backend/requirements.txt
            D=/etc/systemd/system/inv-platform.service.d
            sudo mkdir -p "$D"
            printf '[Service]\nEnvironment=API_KEY=%s\n' \
              "${{ secrets.API_KEY }}" | sudo tee "$D/10-api-key.conf" \
              > /dev/null
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sleep 1
            sudo systemctl daemon-reload
            sudo systemctl restart inv-platform
            sleep 8
            curl -sfH "X-API-Key: ${{ secrets.API_KEY }}" \
              http://127.0.0.1:8000/api/templates > /dev/null \
              || { echo "health check failed, checking journal..."; \
                   sudo journalctl -u inv-platform --no-pager -n 20; exit 1; }
