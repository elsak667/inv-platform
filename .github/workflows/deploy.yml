name: deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_KEY: ${{ secrets.API_KEY }}
      - name: fix frontend permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          script: sudo rm -rf /home/ubuntu/apps/inv-platform/frontend/ && mkdir -p /home/ubuntu/apps/inv-platform/frontend/
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          source: frontend/dist/
          target: /home/ubuntu/apps/inv-platform/frontend/
          strip_components: 1
      - name: restart backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          command_timeout: 2m
          script_stop: true
          script: |
            cd /home/ubuntu/apps/inv-platform
            git pull
            # 存在≠可用；且解释器必须在 uv 托管目录（不归 dpkg，升级清不掉）
            # 本块刻意不用 case 语句/函数定义：script_stop 会把退出码检查逐行注入，
            # 以双分号结尾的 case 分支会被注入坏成语法错误（2026-10-03 部署失败的原因）。
            export UV_PYTHON_PREFERENCE=only-managed
            ok=1
            .venv/bin/python -c 'import fastapi' 2>/dev/null || ok=0
            readlink -f .venv/bin/python3 \
              | grep -q '/.local/share/uv/python/' || ok=0
            if [ "$ok" != "1" ]; then
              echo "venv 不健康或建在系统解释器上，重建到 uv 托管 3.14"
              uv python install 3.14
              rm -rf .venv
              uv venv --python 3.14 .venv
            fi
            uv pip install -q --python .venv/bin/python \
              -r backend/requirements.txt
            D=/etc/systemd/system/inv-platform.service.d
            sudo mkdir -p "$D"
            printf '[Service]\nEnvironment=API_KEY=%s\n' \
              "${{ secrets.API_KEY }}" | sudo tee "$D/10-api-key.conf" \
              > /dev/null
            sudo fuser -k 8000/tcp 2>/dev/null || true
            sleep 1
            sudo systemctl daemon-reload
            sudo systemctl restart inv-platform
            sleep 8
            curl -sfH "X-API-Key: ${{ secrets.API_KEY }}" \
              http://127.0.0.1:8000/api/templates > /dev/null \
              || { echo "health check failed, checking journal..."; \
                   sudo journalctl -u inv-platform --no-pager -n 20; exit 1; }
